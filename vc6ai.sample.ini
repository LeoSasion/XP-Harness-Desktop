[LLM]
; Full Chat Completions endpoint, including /chat/completions. No URL is appended.
ApiUrl=
; Optional for local servers that do not require authentication.
ApiKey=
Model=
; 1 streams public reasoning and answers in desktop/CLI; 0 waits for a full reply.
Stream=1
; Desktop request context budget in serialized UTF-8 bytes (16384..262144).
; Full conversation history stays on disk; this only bounds model input.
ContextBytes=65536
; Optional JSON object for provider options, e.g. {"thinking":{"type":"enabled"},"reasoning_effort":"high"}
ExtraBody=
; Optional, for CLI context statistics only.
ContextWindow=0

[Exa]
ApiKey=
